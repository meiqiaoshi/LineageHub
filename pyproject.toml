[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lineagehub"
version = "0.1.0"
description = "Lightweight metadata platform for dataset lineage and impact analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lineagehub = "lineagehub.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
